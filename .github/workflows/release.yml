name: Release Windows 11 Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release Windows 11 x64
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.23'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: powershell
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          $env:Path += ";$env:USERPROFILE\go\bin"
          wails version

      - name: Install Frontend Dependencies
        shell: powershell
        run: |
          cd frontend
          npm ci
          cd ..

      - name: Build Application with Wails
        shell: powershell
        run: |
          $env:Path += ";$env:USERPROFILE\go\bin"
          wails build -platform windows/amd64 -s -clean=false
          if (-not (Test-Path "build\bin\go-audio-play.exe")) {
            throw "Build output not found at build\bin\go-audio-play.exe"
          }
          Copy-Item "build\bin\go-audio-play.exe" -Destination "build\bin\go-audio-player.exe" -Force
          Compress-Archive -Path "build\bin\go-audio-player.exe" -DestinationPath "GoAudioPlayer-Windows11-x64.zip" -Force

      - name: Determine Release Tag
        id: tag_info
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then TAG="v1.0.0"; fi
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Go Audio Player ${{ steps.tag_info.outputs.tag }}
          files: |
            build/bin/go-audio-player.exe
            GoAudioPlayer-Windows11-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
